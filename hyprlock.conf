# The X session's i3lock-color look: blurred screen, big clock and date, a thin bar
# for the password, yellow/red for verifying/wrong. Fingerprint unlocks too.
# Sizes are logical px: the X numbers / 1.6.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message = Nospiedums nolasīts ✓
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M:%S
    color = rgba(eeeeeeee)
    font_size = 69
    font_family = FantasqueSansM Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(eeeeeeee)
    font_size = 22
    font_family = FantasqueSansM Nerd Font
    position = 0, -30
    halign = center
    valign = center
}

# fingerprint / failure messages where i3lock drew its verify/wrong text
label {
    monitor =
    text = $FPRINTPROMPT$FAIL
    color = rgba(e06c75ee)
    font_size = 22
    font_family = FantasqueSansM Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 3
    outline_thickness = 0
    rounding = 0
    dots_size = 0
    dots_spacing = 0
    inner_color = rgba(eeeeee55)
    font_color = rgba(eeeeeeee)
    check_color = rgba(f9c74fee)
    fail_color = rgba(e06c75ee)
    fail_text =
    placeholder_text =
    fade_on_empty = false
    hide_input = false
    position = 0, -70
    halign = center
    valign = center
}
